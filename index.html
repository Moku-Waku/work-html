<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐播放页</title>
    <!-- 标签栏图标 -->
    <link rel="icon" href="icon/reisa.ico" type="image/png">
    <link href="tailwind_package/src/output.css" rel="stylesheet">
    
</head>
<body>
    <!-- 背景图 -->
    <div class="fixed inset-0 -z-10 bg-cover bg-center bg-no-repeat" 
         style="background-image: url('img/Touhou-.webp');"></div>

    <!-- 导航栏 -->
    <div class="w-full max-w-full h-16 rounded-b-lg opacity-75 bg-[#dbe8f644] font-japen-cute flex items-center">
        <ul class="flex w-full gap-6 list-none justify-center text-3xl">
            <li><a href="index.html" class="text-white hover:text-blue-300 transition">开始</a></li>
            <li><a href="Playlist_page/songlist.html" class="text-white hover:text-blue-300 transition">歌单</a></li>
            <li><a href="#" class="text-white hover:text-blue-300 transition">我的喜欢</a></li>
        </ul>
    </div>

    <!-- 主体部分（滚动的容器） -->
    <div class="bg-[#dbe8f644] w-[80vw] h-[calc(100vh-5rem)] mx-auto mt-4 rounded-md overflow-y-auto p-4 scrollbar-none">
        
        <!--  核心改动：网格布局，自适应一行放几个  -->
        <!-- 手机2列，平板3列，中等屏幕4列，大屏幕5列，gap-4控制卡片间距 -->
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 justify-items-center">
            
            <!-- 卡片 1 -->
            <div class="song-card text-center w-full bg-white/30 rounded-lg p-2 flex flex-col cursor-pointer" data-src="audio/ジャージと愉快な仲間たち - Fiesta de la Luna ～魔法少女達の百年祭.mp3">
                <img src="Album_Cover/63／64 Completion.jpg" class="w-full aspect-square object-cover rounded-md shadow-md" alt="专辑图片">
                <!-- 第一行：加 mt-2 间距，truncate 单行截断 -->
                <p class="font-japen-bit text-[10px] w-full truncate mt-2">ジャージと愉快な仲間たち</p>
                <!-- 第二行：line-clamp-2 最多两行截断 -->
                <p class="font-japen-bit text-[15px] w-full line-clamp-2">Fiesta de la Luna ～魔法少女達の百年祭</p>
            </div>

            <!-- 卡片 2 -->
            <div class="song-card text-center w-full bg-white/30 rounded-lg p-2 flex flex-col cursor-pointer">
                <img src="Album_Cover/63／64 Completion.jpg" class="w-full aspect-square object-cover rounded-md shadow-md" alt="专辑图片">
                <p class="font-japen-bit text-[10px] w-full truncate mt-2">ジャージと愉快な仲間たち</p>
                <p class="font-japen-bit text-[15px] w-full line-clamp-2">Adios, Illusion de los Companeros ～さよなら友の幻よ</p>
            </div>

            <!-- 卡片 3 -->
            <div class="song-card text-center w-full bg-white/30 rounded-lg p-2 flex flex-col cursor-pointer">
                <img src="Album_Cover/63／64 Completion.jpg" class="w-full aspect-square object-cover rounded-md shadow-md" alt="专辑图片">
                <p class="font-japen-bit text-[10px] w-full truncate mt-2">ジャージと愉快な仲間たち</p>
                <p class="font-japen-bit text-[15px] w-full line-clamp-2">Fiesta de la Luna ～魔法少女達の百年祭</p>
            </div>

            <!-- 卡片 4 -->
            <div class="song-card text-center w-full bg-white/30 rounded-lg p-2 flex flex-col cursor-pointer">
                <img src="Album_Cover/63／64 Completion.jpg" class="w-full aspect-square object-cover rounded-md shadow-md" alt="专辑图片">
                <p class="font-japen-bit text-[10px] w-full truncate mt-2">ジャージと愉快な仲間たち</p>
                <p class="font-japen-bit text-[15px] w-full line-clamp-2">Fiesta de la Luna ～魔法少女達の百年祭</p>
            </div>

            <!-- 卡片 5 -->
            <div class="song-card text-center w-full bg-white/30 rounded-lg p-2 flex flex-col cursor-pointer">
                <img src="Album_Cover/63／64 Completion.jpg" class="w-full aspect-square object-cover rounded-md shadow-md" alt="专辑图片">
                <p class="font-japen-bit text-[10px] w-full truncate mt-2">ジャージと愉快な仲間たち</p>
                <p class="font-japen-bit text-[15px] w-full line-clamp-2">Fiesta de la Luna ～魔法少女達の百年祭</p>
            </div>

        </div>
    </div>
    <!-- 隐藏的音频播放器，放在 <body> 结束标签前 -->
    <audio id="my-audio"></audio>
    <script src="js/index.js"></script>
</body>
</html>
